name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 是否创建 GitHub Release
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            label: linux-amd64
            ext: ""

          - os: windows-2025-vs2026
            goos: windows
            goarch: amd64
            label: windows-amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Build
        shell: bash
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o "account_gen${{ matrix.ext }}" .

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          mkdir -p release/
          cp "account_gen${{ matrix.ext }}" release/
          cp README.md release/
          cd release
          tar czf "../account_gen-${{ matrix.label }}.tar.gz" ./*
          cd ..

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path release/
          Copy-Item "account_gen${{ matrix.ext }}" release/
          Copy-Item README.md release/
          Compress-Archive -Path "release/*" -DestinationPath "account_gen-${{ matrix.label }}.zip" -Force

      - name: Checksum
        shell: pwsh
        run: |
          if ("${{ matrix.goos }}" -eq "windows") {
            $file = "account_gen-${{ matrix.label }}.zip"
          } else {
            $file = "account_gen-${{ matrix.label }}.tar.gz"
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -FilePath checksums.txt -Append -Encoding ASCII

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: account_gen-${{ matrix.label }}
          path: |
            account_gen-${{ matrix.label }}.tar.gz
            account_gen-${{ matrix.label }}.zip
          if-no-files-found: warn

  macos:
    name: Build darwin-amd64 + darwin-arm64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Build amd64
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "account_gen_darwin_amd64" .

      - name: Build arm64
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "account_gen_darwin_arm64" .

      - name: Package
        run: |
          mkdir -p release

          cp account_gen_darwin_amd64 release/account_gen
          cp README.md release/
          cd release
          tar czf "../account_gen-darwin-amd64.tar.gz" ./*
          cd ..

          rm release/account_gen

          cp account_gen_darwin_arm64 release/account_gen
          cd release
          tar czf "../account_gen-darwin-arm64.tar.gz" ./*
          cd ..

      - name: Checksums
        shell: pwsh
        run: |
          $hash1 = (Get-FileHash account_gen-darwin-amd64.tar.gz -Algorithm SHA256).Hash.ToLower()
          "$hash1  account_gen-darwin-amd64.tar.gz" | Out-File -FilePath checksums.txt -Append -Encoding ASCII
          $hash2 = (Get-FileHash account_gen-darwin-arm64.tar.gz -Algorithm SHA256).Hash.ToLower()
          "$hash2  account_gen-darwin-arm64.tar.gz" | Out-File -FilePath checksums.txt -Append -Encoding ASCII

      - name: Upload amd64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: account_gen-darwin-amd64
          path: account_gen-darwin-amd64.tar.gz
          if-no-files-found: error

      - name: Upload arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: account_gen-darwin-arm64
          path: account_gen-darwin-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Set Release Tag
        id: set-tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=refs/tags/manual-build-${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "name=手动构建 #${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare Release Assets
        run: |
          mkdir -p assets/
          find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} assets/ \;

      - name: Generate Checksums
        run: |
          cd assets/
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.set-tag.outputs.name }}
          tag_name: ${{ steps.set-tag.outputs.tag }}
          body: |
            ## 账号生成器 ${{ steps.set-tag.outputs.name }}

            ### 下载说明

            | 平台 | 架构 | 文件 |
            |------|------|------|
            | Windows | x86_64 | `account_gen-windows-amd64.zip` |
            | macOS | Intel | `account_gen-darwin-amd64.tar.gz` |
            | macOS | Apple Silicon | `account_gen-darwin-arm64.tar.gz` |
            | Linux | x86_64 | `account_gen-linux-amd64.tar.gz` |

            ### 使用方法

            ```bash
            # 解压后直接运行
            ./account_gen

            # 指定端口
            ./account_gen --port 9090

            # 仅命令行模式
            ./account_gen --cli-only
            ```

            ---
            > 所有安装包均内嵌 Web UI，解压即用，无需额外依赖。
          files: assets/*
          draft: false
          prerelease: false
          generate_release_notes: false